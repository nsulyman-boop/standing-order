[package]
name = "standing-order"
description = "Recurring payroll and scheduled payouts for Sputnik DAO treasuries on NEAR"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/TODO/standing-order"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
